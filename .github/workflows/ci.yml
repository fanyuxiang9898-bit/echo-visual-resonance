name: Build and interaction tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test:unit
      - run: corepack pnpm lint:build
      - run: bash scripts/coze-build.sh
        env:
          NODE_ENV: production
      - run: corepack pnpm audit --prod
      - run: corepack pnpm exec playwright install --with-deps chromium
      - name: Browser interactions against production build
        run: |
          bash scripts/coze-start.sh > /tmp/echo-server.log 2>&1 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:5000 > /dev/null && break; sleep 1; done
          node tests/browser.cjs playwright '' http://127.0.0.1:5000
